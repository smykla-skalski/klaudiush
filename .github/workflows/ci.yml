# CI workflow for klaudiush
# Runs tests, linting, and security checks on pull requests and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: "2.14.0"

jobs:
  ci-scope:
    name: CI Scope
    runs-on: ubuntu-24.04
    outputs:
      run_heavy: ${{ steps.detect.outputs.run_heavy }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect GitHub Actions-only bump
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            echo "run_heavy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              .github/workflows/*.yml|.github/workflows/*.yaml) ;;
              *)
                echo "run_heavy=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          while IFS= read -r line; do
            case "$line" in
              diff\ --git*|index\ *|---\ *|+++\ *|@@\ *) continue ;;
            esac

            case "$line" in
              +*|-*)
                content="${line:1}"
                if [[ ! "$content" =~ ^[[:space:]]*uses:[[:space:]]+[^[:space:]]+@[^[:space:]]+([[:space:]]+\#.*)?$ ]]; then
                  echo "run_heavy=true" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
            esac
          done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- .github/workflows)

          echo "run_heavy=false" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: ci-scope

    steps:
      - name: Report short-circuit
        if: needs.ci-scope.outputs.run_heavy != 'true'
        run: echo "Only GitHub Actions pins changed; skipping tests."

      - name: Checkout
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install ruff
        if: needs.ci-scope.outputs.run_heavy == 'true'
        run: pip install --require-hashes -r .github/workflows/requirements.txt

      - name: Download dependencies
        if: needs.ci-scope.outputs.run_heavy == 'true'
        run: go mod download

      - name: Verify dependencies
        if: needs.ci-scope.outputs.run_heavy == 'true'
        run: go mod verify

      - name: Run tests
        if: needs.ci-scope.outputs.run_heavy == 'true'
        env:
          # Race-instrumented builds create large artifacts that can get
          # corrupted in /tmp under parallel load. Use runner work dir instead.
          # Set here (not workflow-level) so actions/setup-go doesn't see it.
          GOTMPDIR: /home/runner/work/_temp/go-tmp
        run: |
          mkdir -p "$GOTMPDIR"
          # Testscript tests (cmd/klaudiush) use testscript.Main which copies the
          # test binary to a temp dir. Under high parallel load, the binary becomes
          # unavailable for some subtests. Run them separately to avoid this.
          go test -v -race -coverprofile=coverage-main.out $(go list ./... | grep -v /cmd/klaudiush)
          go test -v -race -coverprofile=coverage-cmd.out ./cmd/klaudiush
          # Merge coverage profiles
          head -1 coverage-main.out > coverage.out
          tail -n +2 coverage-main.out >> coverage.out
          tail -n +2 coverage-cmd.out >> coverage.out

      - name: Upload coverage
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: ci-scope

    steps:
      - name: Report short-circuit
        if: needs.ci-scope.outputs.run_heavy != 'true'
        run: echo "Only GitHub Actions pins changed; skipping linters."

      - name: Checkout
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache golangci-lint
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('**/*.go', '.golangci.yml', 'go.mod', 'go.sum') }}

      - name: Run golangci-lint
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v${{ env.GOLANGCI_LINT_VERSION }}
          skip-cache: true

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [ci-scope, test, lint]

    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
      - name: Report short-circuit
        if: needs.ci-scope.outputs.run_heavy != 'true'
        run: echo "Only GitHub Actions pins changed; skipping build."

      - name: Checkout
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        if: needs.ci-scope.outputs.run_heavy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        if: needs.ci-scope.outputs.run_heavy == 'true'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o bin/klaudiush-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/klaudiush
