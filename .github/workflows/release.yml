# Release workflow for klaudiush
# Triggers daily at 2 AM UTC or manually, creates releases using semantic-release + GoReleaser

name: Release

on:
  schedule:
    # Run daily at 2 AM UTC (during night for most US timezones)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  # Run tests first
  test:
    name: Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        env:
          GOTMPDIR: /home/runner/work/_temp/go-tmp
        run: |
          mkdir -p "$GOTMPDIR"
          # Testscript tests (cmd/klaudiush) use testscript.Main which copies the
          # test binary to a temp dir. Under high parallel load, the binary becomes
          # unavailable for some subtests. Run them separately to avoid this.
          go test -v -race -coverprofile=coverage-main.out $(go list ./... | grep -v /cmd/klaudiush)
          go test -v -race -coverprofile=coverage-cmd.out ./cmd/klaudiush
          # Merge coverage profiles
          head -1 coverage-main.out > coverage.out
          tail -n +2 coverage-main.out >> coverage.out
          tail -n +2 coverage-cmd.out >> coverage.out

      - name: Upload coverage
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          files: coverage.out
          fail_ci_if_error: false
        continue-on-error: true

  # Determine if a release should be created
  release:
    name: Semantic Release
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SMYKLOT_APP_ID }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          # conventional-changelog-conventionalcommits is pinned to 9.x on
          # purpose. From 10.0.0 the preset switched to
          # @conventional-changelog/template and requires
          # conventional-changelog-writer 9 or newer, while
          # @semantic-release/release-notes-generator@14 still depends on
          # writer 8. Leaving it unpinned resolves to the newest major at
          # install time, which aborts the release with "Missing helper".
          # Drop the constraint once release-notes-generator ships writer 9.
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            conventional-changelog-conventionalcommits@^9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: smyklot[bot]
          GIT_AUTHOR_EMAIL: 205507218+smyklot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: smyklot[bot]
          GIT_COMMITTER_EMAIL: 205507218+smyklot[bot]@users.noreply.github.com

  # Build and release binaries with GoReleaser
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-24.04
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SMYKLOT_APP_ID }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}
          repositories: klaudiush,homebrew-tap

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GPG_FINGERPRINT: ${{ steps.import-gpg.outputs.fingerprint }}

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

  # Update Nix package hashes after release artifacts are uploaded
  update-nix-hashes:
    name: Update Nix Hashes
    runs-on: ubuntu-24.04
    needs: [release, goreleaser]
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SMYKLOT_APP_ID }}
          private-key: ${{ secrets.SMYKLOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update Nix package hashes
        env:
          GITHUB_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.new_release_version }}
        run: bash scripts/update-nix-hashes.sh "$VERSION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        env:
          VERSION: ${{ needs.release.outputs.new_release_version }}
          REPO: ${{ github.repository }}
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore(nix): update package hashes for v${{ env.VERSION }}'
          title: 'chore(nix): update package hashes for v${{ env.VERSION }}'
          body: |
            Updates `nix/package.nix` with SHA256 hashes for release v${{ env.VERSION }}.

            This PR is automatically generated after each release to ensure the Nix package uses the correct pre-built binaries.

            **Release:** https://github.com/${{ env.REPO }}/releases/tag/v${{ env.VERSION }}
          sign-commits: true
          branch: chore/nix-hashes-${{ env.VERSION }}
          delete-branch: true
          labels: |
            dependencies
            area/ci
          committer: smyklot[bot] <205507218+smyklot[bot]@users.noreply.github.com>
          author: smyklot[bot] <205507218+smyklot[bot]@users.noreply.github.com>
